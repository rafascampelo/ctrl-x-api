name: Backend production

on:
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/backend.yml

  production:
    name: Deploy API
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.BACKEND_PRODUCTION_URL }}
    steps:
      - name: Reject superseded release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" --jq '.object.sha')
          test "$current" = "$EXPECTED_SHA" || { echo '::error::prod has advanced; refusing stale release'; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-release-${{ github.sha }}
      - name: Verify and extract validated source
        run: |
          sha256sum --check release.tar.gz.sha256
          mkdir release
          tar -xzf release.tar.gz -C release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate production configuration before migrations
        working-directory: release
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAILWAY_MIGRATIONS_SERVICE_ID: ${{ vars.RAILWAY_MIGRATIONS_SERVICE_ID }}
          BACKEND_PRODUCTION_URL: ${{ vars.BACKEND_PRODUCTION_URL }}
        run: python -m scripts.release_preflight
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.74.0
      - name: Migrate, deploy and verify production
        working-directory: release
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          BACKEND_PRODUCTION_URL: ${{ vars.BACKEND_PRODUCTION_URL }}
        run: python -m scripts.deploy_railway
